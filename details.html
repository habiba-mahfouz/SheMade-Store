<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details | SHE MADE</title>

  <!-- Instant Direction & Language Init (External) -->
  <script src="js/init.js"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header Mount -->
  <div id="site-header"></div>

  <!-- Main Body -->
  <main class="container my-5">

    <!-- Section 1: Product Details -->
    <div class="row g-5 align-items-start mb-5" id="product-detail-container">

      <!-- Left Column: Main Image & Gallery Thumbnails -->
      <div class="col-12 col-md-6">
        <img id="detail-main-img" src="images/index.jpg" alt="Product Image" class="detail-main-img mb-3">
        <div class="row g-2" id="detail-gallery-thumbs">
          <!-- Thumbnails injected via JS -->
        </div>
      </div>

      <!-- Right Column: Product Info & Order Form -->
      <div class="col-12 col-md-6">
        <h1 class="font-serif display-6 fw-bold mb-3" id="detail-title">Handcrafted Product</h1>
        <div class="product-price fs-3 fw-bold mb-4" id="detail-price">0 EGP</div>
        
        <p class="text-muted mb-4 lead-custom" id="detail-desc">
          Detailed product description handcrafted with love and care.
        </p>

        <form id="product-order-form" class="mt-4" onsubmit="return false;">
          
          <!-- Color Preference (Mandatory) -->
          <div class="mb-4">
            <label class="form-label-custom" for="color-input" data-i18n="color_pref">
              Color Preference / تفاصيل اللون المطلوب <span class="text-danger">*</span>
            </label>
            <input type="text" id="color-input" class="input-custom" placeholder="e.g., Ivory, Sage Green, Deep Rose" data-i18n-placeholder="color_pref_placeholder" required>
            <div id="color-error-msg" class="text-danger small mt-1 d-none" data-i18n="color_error">
              Please specify a color preference before adding to cart!
            </div>
          </div>

          <!-- Notes / Custom Size (Optional) -->
          <div class="mb-4">
            <label class="form-label-custom" for="notes-input" data-i18n="notes_label">
              Special Notes or Sizing (optional) / ملاحظات أو مقاسات خاصة
            </label>
            <textarea id="notes-input" class="input-custom" rows="2" placeholder="Add specific measurements or special instructions here..." data-i18n-placeholder="notes_placeholder"></textarea>
          </div>

          <!-- Quantity Selector -->
          <div class="mb-4">
            <label class="form-label-custom" data-i18n="quantity">Quantity / الكمية</label>
            <div class="qty-selector d-flex align-items-center">
              <button type="button" class="btn-qty" id="qty-minus"><i class="fa-solid fa-minus"></i></button>
              <input type="number" id="qty-input" class="input-qty text-center mx-2" value="1" min="1" max="10" readonly>
              <button type="button" class="btn-qty" id="qty-plus"><i class="fa-solid fa-plus"></i></button>
              <div class="calculated-total ms-4 fs-5 fw-bold text-mauve" id="calculated-total">0 EGP</div>
            </div>
          </div>

          <!-- Add To Cart Button -->
          <div class="d-grid mt-4">
            <button type="button" id="add-to-cart-btn" class="btn btn-mauve py-3 shadow-sm">
              <i class="fa-solid fa-bag-shopping me-2"></i><span data-i18n="add_to_cart">ADD TO CART</span>
            </button>
          </div>

        </form>

      </div>

    </div>

    <!-- Section 2: Related Items -->
    <section class="my-5 pt-4 border-top d-none" id="related-items-section">
      <h2 class="section-title mb-4 font-serif" data-i18n="related_items">Related Items</h2>
      <div class="row g-4" id="related-items-grid">
        <!-- Injected via JavaScript -->
      </div>
    </section>

  </main>

  <!-- Site Footer Mount -->
  <div id="site-footer"></div>

  <!-- Core Scripts (All External) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
