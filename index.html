<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHE MADE | Handcrafted Crochet & Beads</title>

  <!-- Instant Direction & Language Init (External) -->
  <script src="js/init.js"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header Mount -->
  <div id="site-header"></div>

  <!-- Main Content -->
  <main class="container my-4">

    <!-- Section 1: Hero Section -->
    <section class="hero-card shadow-sm">
      <img id="hero-img" src="images/index.jpg" alt="Hero Illustration" class="hero-illustration">
      <div class="hero-overlay"></div>

      <div class="hero-content">
        <h1 class="hero-title" data-i18n="hero_title">Made for women by women</h1>
        <p class="hero-text" data-i18n="hero_sub">
          Handmade Crochet & Beads. Crafted with care, designed to stand out. Discover authentic artisanal pieces.
        </p>
        <a href="#best-seller-section" class="btn btn-mauve" data-i18n="shop_collection">Shop the Collection</a>
      </div>
    </section>

    <!-- Section 2: Best Seller Section -->
    <section id="best-seller-section" class="my-5">
      <div class="section-header">
        <h2 class="section-title" data-i18n="best_seller">Best Seller</h2>
        <a href="category.html?type=bestseller" class="show-all-link" data-i18n="show_all">
          SHOW ALL &rarr;
        </a>
      </div>
      <div class="row g-4" id="best-seller-grid">
        <!-- Injected via JavaScript from products-data.js -->
      </div>
    </section>

    <!-- Section 3: New Arrivals Section -->
    <section class="my-5">
      <div class="section-header">
        <h2 class="section-title" data-i18n="new_arrivals">New Arrivals</h2>
        <a href="category.html?type=newarrival" class="show-all-link" data-i18n="show_all">
          SHOW ALL &rarr;
        </a>
      </div>
      <div class="row g-4" id="new-arrivals-grid">
        <!-- Injected via JavaScript from products-data.js -->
      </div>
    </section>

    <!-- Section 4: Video Section (How to Order?) -->
    <section class="my-5 text-center">
      <h2 class="font-serif fw-bold mb-2" data-i18n="how_to_order">How to Order?</h2>
      <p class="text-muted mb-4" data-i18n="how_to_order_sub">Watch this short video to learn how to easily order via WhatsApp</p>

      <div class="video-card mx-auto max-width-700">
        <video id="order-video" class="w-100 h-100" controls>
          <source src="images/SheMade.mp4" type="video/mp4">
          Your browser does not support the video tag.
        </video>
      </div>
    </section>

  </main>

  <!-- Site Footer Mount -->
  <div id="site-footer"></div>

  <!-- Core Scripts (All External) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
