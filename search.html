<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Results | SHE MADE</title>

  <!-- Instant Direction & Language Init (External) -->
  <script src="js/init.js"></script>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Site Header Mount -->
  <div id="site-header"></div>

  <!-- Main Body -->
  <main class="container my-5">
    
    <!-- Empty Search State -->
    <div id="no-results-container" class="empty-card d-none">
      <div class="empty-icon-wrap bg-light text-muted">
        <i class="fa-regular fa-face-frown"></i>
      </div>
      <h2 class="empty-title">
        <span data-i18n="no_results_title">No Results Found for</span> "<span id="empty-query-text"></span>"
      </h2>
      <p class="empty-text" data-i18n="no_results_sub">
        We couldn't find anything matching your search. Try exploring our curated suggestions below or refine your keywords.
      </p>
      <a href="index.html" class="btn btn-mauve" data-i18n="continue_shopping">CONTINUE SHOPPING</a>
    </div>

    <!-- Search Results State -->
    <div id="results-container">
      <div class="section-header">
        <h1 class="section-title" data-i18n="search_results">Search Results</h1>
      </div>
      <div class="row g-4" id="search-results-grid">
        <!-- Injected via JavaScript from products-data.js -->
      </div>
    </div>

  </main>

  <!-- Site Footer Mount -->
  <div id="site-footer"></div>

  <!-- Core Scripts (All External) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/products-data.js"></script>
  <script src="js/components.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
